name: Publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-static
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx vite build
      - name: Commit built site to repository root
        run: |
          set -euo pipefail
          cp dist/index.html index.html
          cp dist/404.html 404.html
          touch .nojekyll
          rm -rf assets
          cp -a dist/assets assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll assets
          if git diff --cached --quiet; then
            echo "No site changes"
            exit 0
          fi
          git commit -m "chore: publish GitHub Pages build [skip ci]"
          git push
