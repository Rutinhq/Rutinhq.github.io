name = "rutinhq-web"
compatibility_date = "2026-08-30"
pages_build_output_dir = "dist"

# RutinHQ Guide — Pages Function at functions/api/guide.ts
# Dashboard secrets (Production + Preview):
#   GUIDE_LLM_API_KEY          (only if GUIDE_LLM_PROVIDER=openai-compat)
#   GUIDE_LEAD_WEBHOOK_URL
#   TURNSTILE_SECRET_KEY
# Public Turnstile site key lives in [vars] (this project's dashboard only
# accepts Secrets). Vite does not read wrangler.toml — `.env.production` is
# what `vite build` inlines as import.meta.env.VITE_TURNSTILE_SITE_KEY.
# No [env.preview]/[env.production] blocks: top-level [vars] and [ai] apply
# to local, preview, and production (Pages wrangler config; non-inheritable
# keys are only split when an env.* override exists).
# GUIDE_LLM_API_KEY stays a Pages secret (dashboard / wrangler pages secret put).
# PROVIDER + MODEL + BASE_URL must be [vars] here: Direct Upload wipes dashboard
# plaintext. Do not also secret-put the same names (binding clash).
#
# Default LLM is Workers AI (Workers Free 10k neurons/day). Gemini 403'd this
# project ("free tier is not available… set up billing"). Switch back with
# GUIDE_LLM_PROVIDER = "openai-compat" if Gemini billing is ever enabled.
# Model: @cf/meta/llama-3.1-8b-instruct-fp8-fast — current fast 8B in the
# Workers AI pricing table. The older @cf/meta/llama-3.1-8b-instruct-fast id
# is gone from the catalog. Do not pin llama-3.3-70b-instruct-fp8-fast: it
# risks the 9s budget and burns ~6× neurons vs 8B.

# Pages Functions AI binding — https://developers.cloudflare.com/pages/functions/bindings/#workers-ai
# Wrangler key: https://developers.cloudflare.com/pages/functions/wrangler-configuration/#workers-ai
[ai]
binding = "AI"

[vars]
GUIDE_LLM_PROVIDER = "workers-ai"
GUIDE_LLM_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
GUIDE_LLM_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
VITE_TURNSTILE_SITE_KEY = "0x4AAAAAAF6-kFpM12bv15mT"
